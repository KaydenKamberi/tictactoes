<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe AI</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
      h1 {
        font-family: 'Pacifico', cursive;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tic Tac Toe AI</h1>

      <section id="auth-container">
        <div class="auth-card">
          <h2>Register</h2>
          <input id="reg-username" type="text" placeholder="Username" />
          <input id="reg-password" type="password" placeholder="Password" />
          <button id="reg-btn">Create account</button>
        </div>

        <div class="auth-card">
          <h2>Log in</h2>
          <input id="login-username" type="text" placeholder="Username" />
          <input id="login-password" type="password" placeholder="Password" />
          <button id="login-btn">Log in</button>
        </div>
      </section>
      <a href="checkpoints.html" id="checkpoints-link" class="nav-button">View Project Checkpoints</a>
      <section id="user-info" style="display: none;">
        <p>Signed in as <span id="current-user"></span></p>
        <button id="logout-btn">Log out</button>
      </section>

      <section id="game-section">
        <div id="game-mode-selector" style="margin-bottom: 1rem;">
          <label for="game-mode">Game Mode: </label>
          <select id="game-mode">
            <option value="pvp">Player vs. Player</option>
            <option value="pvai">Player vs. AI</option>
          </select>
        </div>
        
        <!-- CP07: Difficulty and Personality Dropdowns -->
        <div id="ai-settings" style="margin-bottom: 1rem; display: none;">
          <div class="dropdown-container">
            <label for="difficulty">Difficulty: </label>
            <select id="difficulty">
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </div>
          <div class="dropdown-container">
            <label for="personality">Personality: </label>
            <select id="personality">
              <option value="Passive-Aggressive Robot">Passive-Aggressive Robot</option>
              <option value="Kind Tic-Tac-Toe Coach">Kind Tic-Tac-Toe Coach</option>
              <option value="Angry Pirate">Angry Pirate</option>
            </select>
          </div>
        </div>
        
        <h2>Game</h2>
        <div id="scoreboard" style="margin-bottom: 1rem; font-weight: bold; color: #cbd5e1;">
          Player X: <span id="score-x">0</span> &nbsp;|&nbsp; <span id="player-o-label">Player O</span>: <span id="score-o">0</span>
        </div>
        <h3 id="turn-indicator">Player X's turn</h3>
        <div id="ai-comment" style="margin: 0.5rem 0; font-style: italic; color: #94a3b8;"></div>
        <div id="game-board" class="board"></div>
      </section>
      <button id="play-again-btn" style="display: none; margin-top: 1rem;">Play Again</button>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
